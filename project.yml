name: Aging
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.72.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.46.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "23"
    GENERATE_INFOPLIST_FILE: NO

schemes:
  Aging:
    build:
      targets:
        Aging: all
    run:
      config: Debug
      storeKitConfiguration: Aging/Services/Products.storekit
    test:
      config: Debug
      gatherCoverageData: false
      storeKitConfiguration: Aging/Services/Products.storekit
      targets:
        - AgingTests
        - AgingUITests

targets:
  Aging:
    type: application
    platform: iOS
    sources:
      - path: Aging
        excludes:
          - PrivacyInfo.xcprivacy
          - Services/Products.storekit
      - path: Shared
      - path: Aging/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Aging
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.aging
        INFOPLIST_FILE: Aging/Info.plist
        CODE_SIGN_ENTITLEMENTS: Aging/Aging.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: Supabase
        product: Supabase

  AgingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AgingTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.aging.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Aging

  AgingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AgingUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.aging.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Aging
    dependencies:
      - target: Aging
